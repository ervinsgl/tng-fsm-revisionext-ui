# This is the resource bundle for com.tng.fsm.revisionext.app

# ===========================
# MANIFEST
# ===========================

#XTIT: Application name
appTitle=FSM Revision Extension

#YDES: Application description
appDescription=FSM Mobile Web Container / Web UI - Revision management for inspection smartforms

#XTIT: Main view title
title=FSM Revision Extension

# ===========================
# HEADER
# ===========================

#XTIT: App header title
headerTitle=FSM Revision Extension

#XFLD: Context source - opened from FSM Mobile app
sourceMobile=Mobile App

#XFLD: Context source - opened from FSM Web UI
sourceWebUi=Web UI

# ===========================
# ERROR STATE
# ===========================

#XTIT: Error title when app opened outside FSM
errorTitle=Open from FSM

#YMSG: Error description when app opened outside FSM
errorDescription=Open this app from FSM Mobile (Web Container) or FSM Web UI (Shell Extension).

# ===========================
# TOOLBAR
# ===========================

#XFLD: Search field placeholder
searchPlaceholder=Search smartforms...

#XBUT: Expand all tables button
expandAll=Expand all

#XBUT: Collapse all tables button
collapseAll=Collapse all

#XBUT: Create revision button
createRevision=Create Revision

# ===========================
# TABLE COLUMNS
# ===========================

#XCOL: Revision column header
colRevision=Revision

#XCOL: Code column header
colCode=Code

#XCOL: Smartform description column header
colSmartformDescription=Smartform Description

#XCOL: Smartform name column header
colSmartformName=Smartform Name

#XCOL: Attachment name column header
colAttachmentName=Attachment Name

#XCOL: Status column header
colStatus=Status

#XCOL: Subject column header
colSubject=Subject

# ===========================
# ROW VALUES
# ===========================

#XFLD: Label for the original (non-revision) activity row
revisionOriginal=Original

#XFLD: Revision label, {0} = revision number
revisionLabel=Rev-{0}

#XFLD: Revision label when number is unknown
revisionLabelUnknown=Rev-?

#XFLD: Smartform status - closed
statusClosed=Closed

#XFLD: Smartform status - open
statusOpen=Open

# ===========================
# NO SMARTFORMS
# ===========================

#YMSG: Shown when the original activity has no smartforms
noSmartformsMessage=No smartforms created for the original activity.

# ===========================
# CREATE REVISION DIALOG
# ===========================

#XTIT: Create revision dialog title
dlgCreateTitle=Create Revision

#XTIT: Revision created success dialog title
dlgCreatedTitle=Revision Created

#XBUT: Confirm create action
actionCreate=Create

#YMSG: No ServiceCall found warning
warnNoServiceCall=No ServiceCall found for the original activity.

#YMSG: Failed to prepare revision, {0} = error message
errPreparing=Failed to prepare the revision: {0}

#YMSG: Failed to create revision, {0} = error message
errCreating=Failed to create revision: {0}

#YMSG: Confirmation line - next revision number, {0} = number
confNextRevision=Next revision number: {0}

#XFLD: Unknown placeholder value
unknown=(unknown)

#YMSG: Confirmation line - revision ServiceCall, {0} = code, {1} = state
confServiceCall=Revision ServiceCall: {0} ({1})

#YMSG: Confirmation line - revision Activity, {0} = code, {1} = state
confActivity=Revision Activity: {0} ({1})

#YMSG: Confirmation line - smartform description, {0} = description
confSmartformDescription=Smartform description: {0}

#XFLD: ServiceCall exists - activity will be appended
stateScExists=EXISTS - activity will be appended

#XFLD: ServiceCall new - will be created
stateScNew=NEW - will be created

#XFLD: Activity exists - smartform attached
stateActExists=EXISTS - smartform attached

#XFLD: Activity new - will be created
stateActNew=NEW - will be created

#YMSG: Success message, {0} = revision number, {1} = smartform description
msgRevisionCreated=Revision number {0} made for smartform ''{1}''.